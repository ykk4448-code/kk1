name: AETHER CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Test API and planning engine
        run: PYTHONPATH=backend pytest backend/tests -q
      - name: Validate frontend module syntax
        run: |
          node --check frontend/assets/api.js
          node --check frontend/assets/charts.js
          node --check frontend/assets/map.js
          node --check frontend/assets/app.js
          node --check frontend/assets/assessment.js
          node --check frontend/assets/mission-v6.js
          node --check frontend/assets/mission-v7.js

      - name: Validate design entrypoint
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('frontend/index.html').read_text()
          assert html.index('workbench.css') < html.index('design-v5.css')
          assert Path('frontend/assets/design-v5.css').is_file()
          assert Path('frontend/tests/test_visual_design_browser.py').is_file()
          PY
      - name: Validate mission console UI integration
        run: pytest frontend/tests/test_mission_console_contract.py frontend/tests/test_mission_v7_contract.py -q
      - name: Build standalone read-only demonstration preview
        run: python scripts/build_preview.py
